[project]
name = "veclite"
version = "0.1.0"
description = "A lightweight, dependency-free vector search engine implementing HNSW from scratch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "fastembed>=0.3",
]
data = [
    "datasets>=2.18",
    "fastembed>=0.3",
]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "api"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
